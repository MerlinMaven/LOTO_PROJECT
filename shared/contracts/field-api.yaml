openapi: "3.1.0"

info:
  title: SmartLOTO Field Service API
  description: |
    Unity-facing runtime API for the SmartLOTO AR LOTO platform.

    FROZEN CONTRACT — these 7 endpoints are consumed by unity-app/SmartLOTOClient.cs.
    Any change to paths, HTTP methods, field names, or field types requires
    recompiling and redistributing the Quest app binary.

    Key constraints:
    - stage_id is INTEGER (Unity StageData.stage_id: int)
    - action_id is STRING
    - anchors object uses organ_name as dict key (custom C# parser)
    - All arrays must be proper JSON arrays (JsonUtility limitation)
  version: "1.0.0"
  contact:
    name: SmartLOTO Field Ops Team

servers:
  - url: http://127.0.0.1:8000
    description: Local (ngrok tunnel in production)

paths:
  /procedures:
    get:
      operationId: listProcedures
      summary: List all APPROVED procedures
      description: Returns machine_id and machine_name for every approved procedure. Unity wraps this array in {"items":[...]} before deserializing.
      tags: [Procedures]
      responses:
        "200":
          description: Array of procedure summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureSummary"
        "500":
          $ref: "#/components/responses/DatabaseUnavailable"

  /procedures/{machine_id}:
    get:
      operationId: getProcedure
      summary: Get a single APPROVED procedure by machine_id
      tags: [Procedures]
      parameters:
        - name: machine_id
          in: path
          required: true
          schema:
            type: string
          example: "COMPRESSEUR_A1"
      responses:
        "200":
          description: Full procedure document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LOTOProcedure"
        "404":
          description: No approved procedure found for this machine
        "500":
          $ref: "#/components/responses/DatabaseUnavailable"

  /procedures/{machine_id}/anchors:
    post:
      operationId: updateAnchors
      summary: Save calibrated AR spatial anchors for a procedure
      tags: [Procedures]
      parameters:
        - name: machine_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorsUpdate"
      responses:
        "200":
          description: Anchors saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "404":
          description: Procedure not found
        "500":
          $ref: "#/components/responses/DatabaseUnavailable"

  /interventions/start:
    post:
      operationId: startIntervention
      summary: Start a new LOTO intervention
      tags: [Interventions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInterventionRequest"
      responses:
        "200":
          description: Intervention created and procedure loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartInterventionResponse"
        "404":
          description: Procedure not found or not approved
        "500":
          $ref: "#/components/responses/DatabaseUnavailable"

  /interventions/validate-step:
    post:
      operationId: validateStep
      summary: Validate a LOTO step via YOLO-World zero-shot detection
      tags: [Interventions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionValidationRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepValidationResponse"
        "400":
          description: Invalid base64 image
        "404":
          description: Intervention not found
        "500":
          $ref: "#/components/responses/DatabaseUnavailable"

  /interventions/override-step:
    post:
      operationId: overrideStep
      summary: Manually validate a step with photographic evidence (degraded mode)
      tags: [Interventions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionOverrideRequest"
      responses:
        "200":
          description: Override recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepValidationResponse"
        "400":
          description: Invalid base64 image
        "404":
          description: Intervention not found

  /interventions/close:
    post:
      operationId: closeIntervention
      summary: Close an intervention, upload signature, generate PDF audit report
      tags: [Interventions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseInterventionRequest"
      responses:
        "200":
          description: Intervention closed and PDF report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseInterventionResponse"
        "404":
          description: Intervention not found

components:
  schemas:
    ProcedureSummary:
      type: object
      required: [machine_id, machine_name]
      properties:
        machine_id:
          type: string
          description: Unique machine identifier (TEXT primary key in Supabase)
          example: "COMPRESSEUR_A1"
        machine_name:
          type: string
          example: "Compresseur Ligne A1"

    SpatialGuide:
      type: object
      description: AR hologram position for a lockout action
      properties:
        hologram_type:
          type: string
          example: "padlock"
        pos_x:
          type: number
          format: float
        pos_y:
          type: number
          format: float
        pos_z:
          type: number
          format: float
        rot_x:
          type: number
          format: float
        rot_y:
          type: number
          format: float
        rot_z:
          type: number
          format: float

    ActionData:
      type: object
      required: [action_id, description]
      properties:
        action_id:
          type: string
          example: "act_1"
        description:
          type: string
          example: "Ouvrir le sectionneur principal"
        vision_prompt:
          type: string
          description: Zero-shot YOLO-World detection prompt in English
          example: "red safety padlock on circuit breaker"
        completion_check:
          type: string
          example: "Verify the breaker handle is in OFF position"
        spatial_guide:
          $ref: "#/components/schemas/SpatialGuide"

    StageData:
      type: object
      required: [stage_id, title, actions]
      properties:
        stage_id:
          type: integer
          description: MUST remain integer — Unity StageData.stage_id is int
          example: 1
        title:
          type: string
          example: "Electrical Isolation"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionData"

    WorkflowStages:
      type: object
      required: [lockout, restoration]
      properties:
        lockout:
          type: array
          items:
            $ref: "#/components/schemas/StageData"
        restoration:
          type: array
          items:
            $ref: "#/components/schemas/StageData"

    LOTOProcedure:
      type: object
      required: [machine_id, machine_name, workflow_stages]
      properties:
        machine_id:
          type: string
        machine_name:
          type: string
        created_by_hse:
          type: string
        status:
          type: string
          enum: [APPROVED]
        workflow_stages:
          $ref: "#/components/schemas/WorkflowStages"
        anchors:
          type: object
          description: >
            Dictionary keyed by organ_name. Parsed by a custom C# parser in
            Unity because JsonUtility cannot deserialize string-keyed dicts.
          additionalProperties:
            type: object
            properties:
              pos_x: { type: number, format: float }
              pos_y: { type: number, format: float }
              pos_z: { type: number, format: float }
              rot_x: { type: number, format: float }
              rot_y: { type: number, format: float }
              rot_z: { type: number, format: float }

    AnchorItem:
      type: object
      required: [organ_name, pos_x, pos_y, pos_z, rot_x, rot_y, rot_z]
      properties:
        organ_name:
          type: string
          example: "sectionneur_principal"
        pos_x: { type: number, format: float }
        pos_y: { type: number, format: float }
        pos_z: { type: number, format: float }
        rot_x: { type: number, format: float }
        rot_y: { type: number, format: float }
        rot_z: { type: number, format: float }

    AnchorsUpdate:
      type: object
      required: [anchors_list]
      properties:
        anchors_list:
          type: array
          items:
            $ref: "#/components/schemas/AnchorItem"

    StartInterventionRequest:
      type: object
      required: [machine_id, operator_name]
      properties:
        machine_id:
          type: string
        operator_name:
          type: string
          example: "Operator-Quest2"

    InterventionData:
      type: object
      required: [id, machine_id, operator_name, status, current_stage_id]
      properties:
        id:
          type: string
          format: uuid
        machine_id:
          type: string
        operator_name:
          type: string
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
        current_stage_id:
          type: integer

    StartInterventionResponse:
      type: object
      required: [status, intervention]
      properties:
        status:
          type: string
          example: "success"
        intervention:
          $ref: "#/components/schemas/InterventionData"

    ActionValidationRequest:
      type: object
      required: [intervention_id, stage_id, action_id, image_base64, vision_prompt]
      properties:
        intervention_id:
          type: string
          format: uuid
        stage_id:
          type: integer
        action_id:
          type: string
        image_base64:
          type: string
          format: byte
          description: Base64-encoded JPEG from Quest 2 camera (with or without data URL prefix)
        vision_prompt:
          type: string
          example: "red safety padlock"

    ActionOverrideRequest:
      type: object
      required: [intervention_id, stage_id, action_id, image_base64, reason]
      properties:
        intervention_id:
          type: string
          format: uuid
        stage_id:
          type: integer
        action_id:
          type: string
        image_base64:
          type: string
          format: byte
        reason:
          type: string
          example: "AI failed to detect padlock due to lighting"

    StepValidationResponse:
      type: object
      required: [verified, message, image_url]
      properties:
        verified:
          type: boolean
        message:
          type: string
        image_url:
          type: string
          format: uri

    CloseInterventionRequest:
      type: object
      required: [intervention_id, signature_base64]
      properties:
        intervention_id:
          type: string
          format: uuid
        signature_base64:
          type: string
          format: byte
          description: Base64-encoded PNG of operator's digital signature

    CloseInterventionResponse:
      type: object
      required: [status, message, pdf_report_url]
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
        pdf_report_url:
          type: string
          format: uri

    SuccessMessage:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string

  responses:
    DatabaseUnavailable:
      description: Supabase or YOLO model not available
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
