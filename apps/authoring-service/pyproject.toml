[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartloto-backend"
version = "2.0.0"
description = "SmartLOTO — Production-grade LOTO safety platform backend"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
